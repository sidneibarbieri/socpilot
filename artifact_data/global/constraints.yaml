    category_contains:
    - machine_learning
    - sensor_based_ml
    - ml_algorithm
    - adware_pup
    - malware
    - malicious
    - suspicious
    - suspei
    - powershell
    - command_line
    - edr_detection
    - ml
- rule_id: account_probe_block
  type: mandatory
  action: block_egress
  governance_scope: network
  severity: hard
  repair_operator: insert
  rationale: Repeated authentication probing is blocked at its source
  evidence_basis: behavior class account_probing (T1110/T1087); derivation 9/200,
