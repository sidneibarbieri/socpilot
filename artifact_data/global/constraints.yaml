- rule_id: ops_monitor_no_isolate
  type: prohibit_when
  action: isolate_host
  governance_scope: endpoint
  severity: hard
  repair_operator: remove
  rationale: Isolating a host over an operational-monitoring event disrupts a branch
    for nothing
  evidence_basis: behavior class ops_monitoring; derivation 7/200, transfer-check
    batch 17/200
  scope:
    category_contains:
    - zabbix
    - context_label_001
    - administration_edit
    - stopped_sending_events
    - monitoramento
    - context_label_003
    - context_label_002
    - unomi
- rule_id: ops_monitor_no_reimage
  type: prohibit_when
  action: reimage_format_host
  governance_scope: endpoint
  severity: hard
  repair_operator: remove
  rationale: Destructive recovery is never a response to an operational-monitoring
    event
  evidence_basis: behavior class ops_monitoring; derivation 7/200, transfer-check
    batch 17/200
  scope:
    category_contains:
    - zabbix
    - context_label_001
    - administration_edit
    - stopped_sending_events
    - monitoramento
    - context_label_003
    - context_label_002
    - unomi
- rule_id: creddump_reset
  type: mandatory
  action: reset_disable_account
  governance_scope: identity
  severity: hard
  repair_operator: insert
  rationale: Dumped credentials are invalid the moment they are dumped
  evidence_basis: behavior class credential_access (T1003); derivation 9/200, transfer-check
    batch 1/200
  scope:
    category_contains:
    - credential
    - dumping
- rule_id: evasion_isolate
  type: mandatory
  action: isolate_host
  governance_scope: endpoint
  severity: hard
  repair_operator: insert
  rationale: Active evasion indicates a live foothold; contain the host
  evidence_basis: behavior class defense_evasion (T1036/T1055); derivation 17/200,
    transfer-check batch 2/200
  scope:
    category_contains:
    - masquerading
    - evasion
    - injection
    - injected
    - recycle_bin
    - bypass
- rule_id: exploit_waf_rule
  type: mandatory
  action: apply_ips_waf_rule
  governance_scope: network
  severity: hard
  repair_operator: insert
  rationale: A known exploit signature is blocked at the perimeter
  evidence_basis: behavior class exploit_attempt (T1190); derivation 17/200, transfer-check
    batch 2/200; analyst record shows WAF rule against Log4Shell
  scope:
    category_contains:
    - exploit
    - log4shell
    - ssrf
    - smuggling
    - heap_spray
    - cgi
    - worm
