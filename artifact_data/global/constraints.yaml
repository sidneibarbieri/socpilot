- rule_id: evidence_before_reimage
  type: prohibit_before
  action: reimage_format_host
  governance_scope: endpoint
  condition_action: collect_forensics
  severity: hard
  repair_operator: insert_before
  rationale: Reimaging destroys volatile evidence; forensics must precede recovery
  evidence_basis: 'Structural operational policy: collect evidence before irreversible
    recovery'
- rule_id: approve_isolate
  type: require_approval
  evidence_tier: specification
  action: isolate_host
  governance_scope: endpoint
  severity: hard
  repair_operator: remove
  alternative_repair_operator: defer_to_human_approval
  rationale: Host isolation interrupts agency business and needs coordinator sign-off
  evidence_basis: Authored safety requirement for deployments with authenticated approval
    records
  approval_evidence:
    source: agency_coordinator_signoff
    default_when_absent: not_approved
- rule_id: approve_reimage
  type: require_approval
  evidence_tier: specification
  action: reimage_format_host
  governance_scope: endpoint
  severity: hard
  repair_operator: remove
  alternative_repair_operator: defer_to_human_approval
  rationale: Reimaging is the catalog's only irreversible action
  evidence_basis: Authored safety requirement for irreversible recovery actions
  approval_evidence:
    source: agency_coordinator_signoff
    default_when_absent: not_approved
- rule_id: approve_lift_isolation
  type: require_approval
  evidence_tier: specification
  action: lift_isolation
  governance_scope: endpoint
  severity: hard
  repair_operator: remove
  alternative_repair_operator: defer_to_human_approval
  rationale: Returning a host to the network reopens the risk isolation contained
  evidence_basis: Authored safety requirement for returning a contained host to the
    network
  approval_evidence:
    source: agency_coordinator_signoff
    default_when_absent: not_approved
- rule_id: approve_account_disable
  type: require_approval
  evidence_tier: specification
  action: reset_disable_account
  governance_scope: identity
  severity: hard
  repair_operator: remove
  alternative_repair_operator: defer_to_human_approval
  rationale: Disabling an account locks a person out of business systems
  evidence_basis: Authored safety requirement for disruptive identity actions
  approval_evidence:
    source: agency_coordinator_signoff
    default_when_absent: not_approved
- rule_id: shadowcopy_tamper_isolate
  type: mandatory
  action: isolate_host
  governance_scope: endpoint
  severity: hard
  repair_operator: insert
  rationale: Shadow-copy tampering is the ransomware precursor; contain before encryption
  evidence_basis: behavior class volume_shadow_copy_tampering (T1490); derivation
    17/200, transfer-check batch 54/200
  scope:
    category_contains:
    - volume_shadow
- rule_id: intel_match_block
  type: mandatory
  action: block_egress
  governance_scope: network
  severity: hard
  repair_operator: insert
  rationale: A reviewed intelligence match is actionable; block the matched source
  evidence_basis: behavior class intelligence_indicator_match; derivation 19/200,
    transfer-check batch 92/200
  scope:
    category_contains:
    - custom_intelligence_indicator
    - ioc_management_action
    - edr_intelligence_indicator
    - indicator_of_compromise
    - quarenten
- rule_id: sensor_tamper_isolate
  type: mandatory
  action: isolate_host
  governance_scope: endpoint
  severity: hard
  repair_operator: insert
  rationale: Tampering with the security sensor blinds defense; contain the host
  evidence_basis: behavior class security_tool_tampering (T1562); derivation 6/200,
    transfer-check batch 3/200
  scope:
    category_contains:
    - falcon_sensor
    - disable_or_modify_tools
- rule_id: remote_access_block
  type: mandatory
  action: block_egress
  governance_scope: network
  severity: hard
  repair_operator: insert
  rationale: Unauthorized remote-access channels are cut at the perimeter
  evidence_basis: behavior class suspicious_remote_access (T1133/T1021); derivation
    6/200, transfer-check batch 9/200
  scope:
    category_contains:
    - accept_remote
    - acesso_remoto
    - ssh_or_telnet
    - remoteaccess
    - remote_administrat
    - lateral_movement
    - remote_services
- rule_id: malware_detect_quarantine
  type: mandatory
  action: quarantine_artifact
  governance_scope: endpoint
  severity: hard
  repair_operator: insert
  rationale: A reviewed EDR/ML malicious verdict requires quarantining the artifact
  evidence_basis: behavior class malware_detection; derivation 59/200, transfer-check
    batch 10/200
